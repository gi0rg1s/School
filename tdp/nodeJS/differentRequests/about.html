<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color:  #ffcad4 ;
      background-attachment: fixed;
      padding: 20px;
    }

    .card {
      background-color: rgba(255, 255, 255, 0.9);
      padding: 50px 40px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(230, 175, 190, 0.3);
      text-align: center;
      max-width: 450px;
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.6);
    }

    h1 {
      color: #9d5c63;
      font-size: 2rem;
      margin-bottom: 15px;
      font-weight: 600;
    }

    p {
      color: #7a6368;
      font-size: 1.1rem;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Benvenuto in about!</h1>
  </div>

</body>
</html>
